name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      # Step 4: Linting (QA Gate 1)
      - name: Run lint checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Step 5: Run unit tests with coverage (QA Gate 2)
      - name: Run unit tests
        run: |
          pytest --cov=./ --cov-report=xml --cov-fail-under=80

      # Step 6: Upload coverage report (Optional)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' # only deploy from main branch

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Build
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/capstone-flask:latest .

      # Docker Push
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/capstone-flask:latest
